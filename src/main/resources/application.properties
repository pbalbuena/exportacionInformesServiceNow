spring.application.name=importerOMA

# ==========================
# Credenciales de ServiceNow
# En despliegue, sobrescribir estos valores con un application.properties
# externo (junto al jar o en una carpeta config/) que Spring Boot carga
# automaticamente y con prioridad sobre este fichero empaquetado.
